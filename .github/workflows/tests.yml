name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      NODE_OPTIONS: --experimental-vm-modules
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: tests
        run: |
          npm test -- --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 30

      - name: Add test summary
        if: always()
        run: |
          {
            echo "## Test Results"
            echo ""
            echo "- Status: **${{ job.status }}**"
            echo "- Tests step outcome: **${{ steps.tests.outcome }}**"
            echo ""
            echo "Coverage reports have been uploaded as an artifact named \`coverage-report\` and will be retained for 30 days."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate test failures
        if: failure()
        run: |
          echo "::error title=Test failures detected::One or more tests failed. \
          Check the test logs and coverage report artifact. \
          Ensure that your changes include updated tests and that all assertions pass."
